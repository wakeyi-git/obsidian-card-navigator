name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history for changelog generation

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test

    - name: Build plugin
      run: npm run build

    - name: Get version from tag
      id: get_version
      run: |
        # Tags are in format "1.1.0" (without v prefix)
        VERSION="${GITHUB_REF#refs/tags/}"
        echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
        echo "VERSION_NUMBER=${VERSION}" >> $GITHUB_OUTPUT

    - name: Extract changelog for this version
      id: changelog
      run: |
        VERSION="${{ steps.get_version.outputs.VERSION_NUMBER }}"
        # Extract the changelog section using Python for precise control
        python3 << 'PYTHON_SCRIPT' > /tmp/release_notes.md
        import sys
        import re

        version = "${{ steps.get_version.outputs.VERSION_NUMBER }}"

        with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
            content = f.read()

        # Find the version section
        pattern = rf'^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n---\n|^## \[|^# )'
        match = re.search(pattern, content, re.MULTILINE | re.DOTALL)

        if match:
            changelog = match.group(1).strip()
            print(changelog)
        else:
            # Fallback to Unreleased if version not found
            pattern = r'^## \[Unreleased\][^\n]*\n(.*?)(?=\n---\n|^## \[|^# )'
            match = re.search(pattern, content, re.MULTILINE | re.DOTALL)
            if match:
                print(match.group(1).strip())
            else:
                print("No changelog found for this version")
        PYTHON_SCRIPT
        echo "CHANGELOG_FILE=/tmp/release_notes.md" >> $GITHUB_OUTPUT

    - name: Verify required files exist
      run: |
        test -f main.js || (echo "main.js not found!" && exit 1)
        test -f manifest.json || (echo "manifest.json not found!" && exit 1)
        test -f styles.css || (echo "styles.css not found!" && exit 1)

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        name: Release ${{ steps.get_version.outputs.VERSION }}
        body_path: ${{ steps.changelog.outputs.CHANGELOG_FILE }}
        draft: false
        prerelease: false
        files: |
          main.js
          manifest.json
          styles.css
        token: ${{ secrets.GITHUB_TOKEN }}
        fail_on_unmatched_files: true
        generate_release_notes: false
